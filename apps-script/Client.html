<script>
(() => {
  'use strict';
  const state = { token: '', refreshToken: '', user: null, refs: null, page: 'dashboard', pageNumber: 1, lastDashboard: null, pollId: null, queryTimer: null, realtimeClient: null, realtimeChannel: null, realtimeTimer: null, operationsPeriod: 'week', operationsBrokerId: '', operationsDateFrom: '', operationsDateTo: '', operationsQuery: '', operationsAttendanceDay: '' };
  const byId = (id) => document.getElementById(id);
  const ADMIN_ROLES = ['Administrador', 'Gerente', 'Coordenador', 'Assistente'];
  const ROLE_LIST = ['Administrador', 'Gerente', 'Coordenador', 'Assistente', 'SDR', 'Corretor'];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function button(text, className, onClick) {
    const node = el('button', 'button ' + (className || ''), text);
    node.type = 'button';
    node.addEventListener('click', onClick);
    return node;
  }

  function callApi(method, ...args) {
    const request = (apiMethod, apiArgs) => fetch('/.netlify/functions/crm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      credentials: 'same-origin',
      body: JSON.stringify({ method: apiMethod, args: apiArgs })
    }).then(async (response) => ({ response, result: await response.json().catch(() => ({})) }));
    return request(method, args).then(async ({ response, result }) => {
      const refreshable = ['apiLogin', 'apiRefresh', 'apiBootstrapInfo', 'apiBootstrapAdmin', 'apiLogout'];
      if (response.status === 401 && state.refreshToken && !refreshable.includes(method)) {
        const refreshed = await request('apiRefresh', [state.refreshToken]);
        if (refreshed.response.ok && refreshed.result && refreshed.result.ok === true) {
          state.token = refreshed.result.token;
          state.refreshToken = refreshed.result.refreshToken;
          sessionStorage.setItem('crm-session-token', state.token);
          sessionStorage.setItem('crm-refresh-token', state.refreshToken);
          if (state.realtimeClient) { try { state.realtimeClient.realtime.setAuth(state.token); } catch (_) { setRealtimeStatus('fallback'); } }
          const retryArgs = args.slice();
          retryArgs[0] = state.token;
          const retry = await request(method, retryArgs);
          if (!retry.response.ok) throw new Error(retry.result.message || 'Falha ao comunicar com o sistema.');
          return retry.result;
        }
        state.token = ''; state.refreshToken = '';
        sessionStorage.removeItem('crm-session-token'); sessionStorage.removeItem('crm-refresh-token');
      }
      if (!response.ok) throw new Error(result.message || 'Falha ao comunicar com o sistema.');
      return result;
    });
  }

  function toast(message, kind) {
    const region = byId('toast-region');
    const item = el('div', 'toast ' + (kind || ''), message);
    region.appendChild(item);
    window.setTimeout(() => item.remove(), 4200);
  }

  function setRealtimeStatus(status) {
    const label = byId('sync-label'); const dot = byId('sync-dot');
    if (!label || !dot) return;
    const labels = { connecting: 'Conectando atualização…', live: 'Atualização em tempo real ativa', fallback: 'Atualização automática ativa' };
    label.textContent = labels[status] || labels.fallback;
    dot.className = 'live-dot sync-dot-' + (status === 'live' ? 'live' : status === 'fallback' ? 'fallback' : 'connecting');
  }

  function loadRealtimeSdk() {
    if (window.supabase && window.supabase.createClient) return Promise.resolve(window.supabase);
    return new Promise((resolve, reject) => {
      let script = byId('supabase-realtime-sdk');
      if (!script) { script = document.createElement('script'); script.id = 'supabase-realtime-sdk'; script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.119.0/dist/umd/supabase.js'; script.async = true; document.head.appendChild(script); }
      script.addEventListener('load', () => window.supabase && window.supabase.createClient ? resolve(window.supabase) : reject(new Error('SDK indisponível')), { once: true });
      script.addEventListener('error', () => reject(new Error('SDK indisponível')), { once: true });
    });
  }

  async function stopRealtimeSync() {
    if (state.realtimeTimer) window.clearTimeout(state.realtimeTimer);
    state.realtimeTimer = null;
    if (state.realtimeClient && state.realtimeChannel) await state.realtimeClient.removeChannel(state.realtimeChannel).catch(() => {});
    state.realtimeChannel = null; state.realtimeClient = null;
  }

  function scheduleRealtimeRefresh() {
    if (state.realtimeTimer) window.clearTimeout(state.realtimeTimer);
    state.realtimeTimer = window.setTimeout(() => {
      state.realtimeTimer = null;
      if (!document.hidden && state.token) refreshPage(true).catch(handleFailure);
    }, 250);
  }

  async function startRealtimeSync() {
    await stopRealtimeSync();
    const config = state.refs && state.refs.realtime;
    if (!config || !config.url || !config.publishableKey || !state.token || (state.user && state.user.mustChangePassword)) { setRealtimeStatus('fallback'); return; }
    setRealtimeStatus('connecting');
    try {
      const sdk = await loadRealtimeSdk();
      if (!state.token) return;
      const client = sdk.createClient(config.url, config.publishableKey, { auth: { persistSession: false, autoRefreshToken: false, detectSessionInUrl: false } });
      state.realtimeClient = client;
      await client.realtime.setAuth(state.token);
      state.realtimeChannel = client.channel('crm-sync-signal').on('postgres_changes', {
        event: 'UPDATE', schema: 'public', table: 'crm_sync_signal', filter: 'id=eq.1'
      }, scheduleRealtimeRefresh).subscribe((status) => {
        if (status === 'SUBSCRIBED') setRealtimeStatus('live');
        else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT' || status === 'CLOSED') setRealtimeStatus('fallback');
      });
    } catch (_) { setRealtimeStatus('fallback'); await stopRealtimeSync(); }
  }

  document.addEventListener('visibilitychange', () => {
    if (!document.hidden && state.token) refreshPage(true).catch(handleFailure);
  });

  function showLoading(message) {
    const area = byId('content-area');
    area.replaceChildren();
    const box = el('div', 'loading');
    const stack = el('div');
    stack.append(el('div', 'spinner'), el('div', '', message || 'Carregando dados…'));
    box.appendChild(stack);
    area.appendChild(box);
  }

  function isAdmin() { return Boolean(state.user && ADMIN_ROLES.includes(state.user.role)); }
  function isManagerOrSdr() { return Boolean(state.user && (isAdmin() || state.user.role === 'SDR')); }
  function operationsAccess() {
    if (!state.user) return 'none';
    if (state.user.operationsAccess) return state.user.operationsAccess;
    if (state.user.role === 'Corretor') return 'broker';
    if (state.user.role === 'SDR') return 'sdr';
    return isAdmin() ? 'viewer' : 'none';
  }
  function canReadOperations() { return ['broker','sdr','viewer','manager'].includes(operationsAccess()); }
  function canManageOperations() { return operationsAccess() === 'manager'; }
  function isOperationsTeamReader() { return ['sdr','viewer','manager'].includes(operationsAccess()); }
  function escapeDisplay(value) { return String(value === undefined || value === null || value === '' ? '—' : value); }

  async function handleFailure(error) {
    const message = error && error.message ? error.message : 'Não foi possível concluir a operação.';
    if (/sessão (expirada|inválida)|entre novamente|sistema não inicializado/i.test(message)) {
      await logout(false);
      byId('login-error').textContent = 'Sua sessão expirou. Entre novamente.';
      return;
    }
    toast(message, 'error');
  }

  function readFilters(staleOnly) {
    const filters = {
      query: byId('filter-query').value.trim(),
      developmentId: byId('filter-development').value,
      status: byId('filter-status').value,
      dateFrom: byId('filter-from').value,
      dateTo: byId('filter-to').value,
      periodMode: byId('filter-period').value,
      staleOnly: staleOnly === true
    };
    if (isManagerOrSdr()) filters.brokerId = byId('filter-broker').value;
    return filters;
  }

  async function login(event) {
    event.preventDefault();
    const submit = byId('login-submit');
    const error = byId('login-error');
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Verificando…';
    try {
      const result = await callApi('apiLogin', byId('login-email').value, byId('login-password').value);
      if (!result || result.ok !== true) throw new Error(result && result.message ? result.message : 'E-mail ou senha inválidos.');
      state.token = result.token;
      state.refreshToken = result.refreshToken || '';
      state.user = result.user;
      sessionStorage.setItem('crm-session-token', state.token);
      if (state.refreshToken) sessionStorage.setItem('crm-refresh-token', state.refreshToken);
      byId('login-password').value = '';
      await enterApplication();
    } catch (err) {
      error.textContent = err.message || 'Não foi possível entrar.';
    } finally {
      submit.disabled = false;
      submit.textContent = 'Entrar no sistema';
    }
  }

  async function restoreSession() {
    const token = sessionStorage.getItem('crm-session-token');
    if (!token) return;
    state.token = token;
    state.refreshToken = sessionStorage.getItem('crm-refresh-token') || '';
    try {
      state.refs = await callApi('apiGetReferenceData', token);
      state.user = state.refs.user;
      await enterApplication(true);
    } catch (error) {
      sessionStorage.removeItem('crm-session-token');
      state.token = '';
    }
  }

  async function enterApplication(restored) {
    state.refs = await callApi('apiGetReferenceData', state.token);
    state.user = state.refs.user || state.user;
    byId('login-view').classList.add('hidden');
    byId('app-view').classList.remove('hidden');
    byId('user-name').textContent = state.user.name;
    byId('user-role').textContent = state.user.role;
    byId('user-avatar').textContent = state.user.name.split(/\s+/).slice(0, 2).map((part) => part[0]).join('').toUpperCase();
    byId('users-nav').classList.toggle('hidden', !isAdmin());
    byId('developments-nav').classList.toggle('hidden', !isAdmin());
    byId('sales-nav').classList.toggle('hidden', !isAdmin());
    byId('audit-nav').classList.toggle('hidden', !isAdmin());
    const canSeeContracts = isAdmin() || ['Corretor','SDR'].includes(state.user.role);
    byId('contracts-nav').classList.toggle('hidden', !canSeeContracts);
    byId('sales-docs-nav').classList.toggle('hidden', !canSeeContracts);
    byId('new-leads-nav').classList.toggle('hidden', !(isAdmin() || state.user.role === 'SDR'));
    byId('sdr-alerts-nav').classList.toggle('hidden', state.user.role !== 'SDR');
    document.querySelectorAll('.operations-nav').forEach((item) => item.classList.toggle('hidden', !canReadOperations()));
    document.querySelectorAll('.admin-nav').forEach((item) => item.classList.toggle('hidden', !isAdmin()));
    byId('menu-toggle').onclick = () => setMobileMenu(true);
    byId('nav-scrim').onclick = () => setMobileMenu(false);
    byId('broker-filter-wrap').classList.toggle('hidden', !isManagerOrSdr());
    fillFilters();
    bindNavigation();
    state.page = 'dashboard';
    setActiveNav('dashboard');
    if (state.user.mustChangePassword) showLoading('Defina uma nova senha para continuar.');
    else await refreshPage();
    if (state.pollId) window.clearInterval(state.pollId);
    state.pollId = state.user.mustChangePassword ? null : window.setInterval(() => {
      if (!document.hidden && state.token) {
        refreshPage(true).catch(handleFailure);
        if (state.user && state.user.role === 'SDR' && !['dashboard','sdrAlerts'].includes(state.page)) updateSdrNavigation().catch(handleFailure);
      }
    }, 20000);
    if (!state.user.mustChangePassword) startRealtimeSync().catch(() => setRealtimeStatus('fallback'));
    else setRealtimeStatus('fallback');
    if (state.user.mustChangePassword) openPasswordDialog(true);
    else if (!restored) toast('Bem-vindo, ' + state.user.name.split(' ')[0] + '.', 'success');
  }

  function fillFilters() {
    const project = byId('filter-development');
    project.replaceChildren(new Option('Todos', ''));
    state.refs.developments.forEach((item) => project.add(new Option(item.name, item.id)));
    const status = byId('filter-status');
    status.replaceChildren(new Option('Todos', ''));
    state.refs.statuses.forEach((item) => status.add(new Option(item.name, item.name)));
    if (isManagerOrSdr()) {
      const broker = byId('filter-broker');
      broker.replaceChildren(new Option('Todos', ''));
      state.refs.brokers.forEach((item) => broker.add(new Option(item.name, item.id)));
    }
    document.querySelectorAll('#filters-panel input,#filters-panel select').forEach((control) => {
      control.onchange = () => { state.pageNumber = 1; refreshPage().catch(handleFailure); };
    });
    byId('filter-query').oninput = () => {
      window.clearTimeout(state.queryTimer);
      state.queryTimer = window.setTimeout(() => { state.pageNumber = 1; refreshPage().catch(handleFailure); }, 350);
    };
    byId('clear-filters').onclick = () => {
      byId('filter-query').value = '';
      byId('filter-broker').value = '';
      byId('filter-development').value = '';
      byId('filter-status').value = '';
      byId('filter-from').value = '';
      byId('filter-to').value = '';
      state.pageNumber = 1;
      refreshPage().catch(handleFailure);
    };
    byId('refresh-button').onclick = () => refreshPage().catch(handleFailure);
    byId('logout-button').onclick = () => logout(true);
    byId('change-password-button').onclick = () => openPasswordDialog(false);
  }

  function bindNavigation() {
    byId('main-nav').querySelectorAll('[data-page]').forEach((item) => {
      item.onclick = () => {
        if (item.classList.contains('hidden')) return;
        setMobileMenu(false);
        state.page = item.dataset.page;
        state.pageNumber = 1;
        setActiveNav(state.page);
        refreshPage().catch(handleFailure);
      };
    });
  }

  function setMobileMenu(open) {
    const sidebar = document.querySelector('.sidebar');
    const toggle = byId('menu-toggle');
    const scrim = byId('nav-scrim');
    if (!sidebar || !toggle || !scrim) return;
    sidebar.classList.toggle('is-open', Boolean(open));
    scrim.classList.toggle('hidden', !open);
    toggle.setAttribute('aria-expanded', open ? 'true' : 'false');
    toggle.setAttribute('aria-label', open ? 'Fechar menu' : 'Abrir menu');
    document.body.classList.toggle('menu-open', Boolean(open));
  }

  function setActiveNav(page) {
    byId('main-nav').querySelectorAll('[data-page]').forEach((item) => item.classList.toggle('active', item.dataset.page === page));
    const titles = { dashboard: ['PLATAFORMA COMERCIAL', 'Visão geral'], leads: ['RELACIONAMENTO', 'Clientes'], newLeads: ['RELACIONAMENTO', 'Novos cadastros'], sdrAlerts: ['RELACIONAMENTO', 'Alertas SDR'], archivedLeads: ['ADMINISTRAÇÃO', 'Clientes excluídos'], followups: ['RELACIONAMENTO', 'Follow-ups'], users: ['ADMINISTRAÇÃO', 'Equipe'], archivedUsers: ['ADMINISTRAÇÃO', 'Usuários excluídos'], developments: ['ADMINISTRAÇÃO', 'Empreendimentos'], sales: ['VENDAS & REPASSES', 'Vendas e repasses'], contracts: ['VENDAS & DOCUMENTOS', 'Contratos'], operationsDashboard: ['PRODUÇÃO & FREQUÊNCIA', 'Resultados da equipe'], production: ['PRODUÇÃO & FREQUÊNCIA', 'Lançamentos'], goals: ['PRODUÇÃO & FREQUÊNCIA', 'Metas'], attendance: ['PRODUÇÃO & FREQUÊNCIA', 'Plantões'], operationsReports: ['PRODUÇÃO & FREQUÊNCIA', 'Relatórios'], audit: ['ADMINISTRAÇÃO', 'Histórico de alterações'] };
    const current = titles[page] || titles.dashboard;
    const navPage = page === 'archivedLeads' ? 'leads' : page === 'archivedUsers' ? 'users' : page;
    byId('page-kicker').textContent = current[0];
    byId('page-title').textContent = current[1];
    byId('main-nav').querySelectorAll('[data-page]').forEach((item) => item.classList.toggle('active', item.dataset.page === navPage));
    const filters = byId('filters-panel');
    filters.classList.toggle('hidden', ['users','archivedUsers','developments','sales','contracts','audit','operationsDashboard','production','goals','attendance','operationsReports'].includes(page));
    filters.classList.toggle('dashboard-mode', page === 'dashboard');
    if (page === 'dashboard') { byId('filter-query').value = ''; byId('filter-status').value = ''; }
  }

  async function refreshPage(silent) {
    if (!state.token) return;
    if (!silent) showLoading('Atualizando ' + (state.page === 'dashboard' ? 'indicadores' : 'dados') + '…');
    if (state.page === 'dashboard') await renderDashboard();
    else if (state.page === 'operationsDashboard') await renderOperationsDashboard();
    else if (state.page === 'production') await renderProduction();
    else if (state.page === 'goals') await renderOperationGoals();
    else if (state.page === 'attendance') await renderAttendance();
    else if (state.page === 'operationsReports') await renderOperationsReports();
    else if (state.page === 'leads') await renderLeads(false);
    else if (state.page === 'newLeads') await renderLeads(false, 'new');
    else if (state.page === 'sdrAlerts') await renderSdrAlertsPage();
    else if (state.page === 'archivedLeads') await renderArchivedLeads();
    else if (state.page === 'followups') await renderLeads(true);
    else if (state.page === 'users') await renderUsers();
    else if (state.page === 'archivedUsers') await renderArchivedUsers();
    else if (state.page === 'developments') await renderDevelopments();
    else if (state.page === 'sales') await renderSales();
    else if (state.page === 'contracts') await renderContracts();
    else if (state.page === 'audit') await renderAudit();
  }

  function kpi(label, value, sub, color) {
    const card = el('article', 'kpi-card');
    const accent = el('span', 'kpi-accent');
    if (color) accent.style.backgroundColor = color;
    card.append(accent, el('div', 'kpi-label', label), el('div', 'kpi-value', value), el('div', 'kpi-sub', sub || ''));
    return card;
  }

  const OPERATION_METRICS = [
    { id: 'prospections', label: 'Prospecções', color: '#93651D' },
    { id: 'interactions', label: 'Interações', color: '#76502A' },
    { id: 'appointments', label: 'Agendamentos', color: '#A98647' },
    { id: 'visits', label: 'Visitas', color: '#B9944D' },
    { id: 'sales', label: 'Vendas (quantidade)', color: '#25231F' }
  ];
  const OPERATION_SHIFTS = [
    { id: 'morning', label: 'Manhã' }, { id: 'afternoon', label: 'Tarde' }, { id: 'night', label: 'Noite' }
  ];
  function operationFilters() {
    return { period: state.operationsPeriod || 'week', brokerId: state.operationsBrokerId || '', dateFrom: state.operationsDateFrom || '', dateTo: state.operationsDateTo || '' };
  }
  function operationFilterBar(onChange) {
    const bar = el('div', 'ops-filterbar');
    const period = makeSelect([{ label: 'Hoje', value: 'day' }, { label: 'Semana atual', value: 'week' }, { label: 'Mês atual', value: 'month' }], state.operationsPeriod || 'week');
    period.setAttribute('aria-label', 'Período operacional');
    const periodWrap = el('label', 'filter-field'); periodWrap.append(el('span', '', 'Período'), period); bar.appendChild(periodWrap);
    if (isOperationsTeamReader()) {
      const broker = makeSelect([{ label: 'Toda a equipe', value: '' }, ...state.refs.brokers.map((item) => ({ label: item.name, value: item.id }))], state.operationsBrokerId || '');
      broker.setAttribute('aria-label', 'Filtrar por corretor');
      const brokerWrap = el('label', 'filter-field'); brokerWrap.append(el('span', '', 'Corretor'), broker); bar.appendChild(brokerWrap);
      broker.onchange = () => { state.operationsBrokerId = broker.value; onChange(); };
    }
    const from = document.createElement('input'); from.type = 'date'; from.value = state.operationsDateFrom || ''; from.max = todayBrazil(); from.setAttribute('aria-label', 'Data inicial');
    const fromWrap = el('label', 'filter-field'); fromWrap.append(el('span', '', 'De'), from); bar.appendChild(fromWrap);
    const to = document.createElement('input'); to.type = 'date'; to.value = state.operationsDateTo || ''; to.max = todayBrazil(); to.setAttribute('aria-label', 'Data final');
    const toWrap = el('label', 'filter-field'); toWrap.append(el('span', '', 'Até'), to); bar.appendChild(toWrap);
    const applyCustom = () => { state.operationsDateFrom = from.value; state.operationsDateTo = to.value; onChange(); };
    from.onchange = applyCustom; to.onchange = applyCustom;
    period.onchange = () => { state.operationsPeriod = period.value; state.operationsDateFrom = ''; state.operationsDateTo = ''; onChange(); };
    const hint = el('span', 'ops-filter-hint', 'Dia: hoje · semana: segunda a domingo · mês: do primeiro ao último dia.'); bar.appendChild(hint);
    return bar;
  }
  function operationsHeader(title, description, actions) {
    const head = el('div', 'page-heading ops-page-header'); const copy = el('div');
    copy.append(el('h2', '', title), el('p', '', description)); head.appendChild(copy);
    if (actions) head.appendChild(actions);
    return head;
  }
  function operationsTable(headers, rows, minWidth) {
    const wrapper = el('div', 'ops-table-wrap'); const table = el('table', 'ops-table');
    if (minWidth) table.style.minWidth = minWidth;
    const thead = el('thead'); const headRow = el('tr'); headers.forEach((header) => headRow.appendChild(el('th', header.numeric ? 'numeric' : '', header.label || header)));
    thead.appendChild(headRow); table.appendChild(thead); const body = el('tbody');
    if (!rows.length) { const row = el('tr'); const cell = el('td', 'ops-empty', 'Nenhum registro encontrado neste período.'); cell.colSpan = headers.length; row.appendChild(cell); body.appendChild(row); }
    else rows.forEach((values) => { const row = el('tr'); values.forEach((value, index) => { const cell = el('td', headers[index] && headers[index].numeric ? 'numeric' : ''); if (value instanceof Node) cell.appendChild(value); else cell.textContent = String(value === undefined || value === null ? '—' : value); row.appendChild(cell); }); body.appendChild(row); });
    table.appendChild(body); wrapper.appendChild(table); return wrapper;
  }
  function operationComparisonText(item) {
    if (!item || item.previous === 0) return 'Sem base anterior para comparar';
    const sign = item.difference > 0 ? '+' : '';
    const percent = item.changePct === null ? '' : ' (' + (item.changePct > 0 ? '+' : '') + item.changePct + '%)';
    return sign + item.difference + ' vs. período anterior' + percent;
  }
  function formatDateOnly(value) { return String(value || '').split('-').reverse().join('/') || '—'; }
  function operationsPage(onChange) {
    const page = el('div', 'ops-page');
    page.appendChild(operationFilterBar(onChange));
    return page;
  }

  async function renderOperationsDashboard() {
    if (!canReadOperations()) { state.page = 'dashboard'; setActiveNav('dashboard'); return renderDashboard(); }
    const data = await callApi('apiGetOperationsDashboard', state.token, operationFilters());
    const area = byId('content-area'); area.replaceChildren();
    const page = operationsPage(() => renderOperationsDashboard().catch(handleFailure));
    page.prepend(operationsHeader('Resultados da equipe', 'Produção, metas e frequências em painéis próprios. Estes números não representam quantidade de leads nem valores financeiros.'));
    const freshness = el('div', 'ops-freshness');
    freshness.append(el('strong', '', 'Última atualização'), el('span', '', data.latestUpdatedAt ? formatDate(data.latestUpdatedAt) : 'Sem lançamentos registrados'));
    freshness.setAttribute('aria-live', 'polite');
    page.appendChild(freshness);
    const cards = el('section', 'ops-kpi-grid');
    OPERATION_METRICS.forEach((metric) => cards.appendChild(kpi(metric.label, data.totals[metric.id], operationComparisonText(data.comparison[metric.id]), metric.color)));
    cards.appendChild(kpi('Frequências em plantões', data.attendanceByShift.total, operationComparisonText(data.comparison.attendance), '#76502A'));
    page.appendChild(cards);

    const dailyPanel = el('section', 'panel');
    const dailyHead = el('div', 'panel-header'); const dailyTitle = el('div');
    dailyTitle.append(el('h3', '', 'Evolução diária da produção'), el('p', '', 'Prospecções, visitas e vendas em quantidade no período selecionado.'));
    dailyHead.append(dailyTitle, el('span', 'panel-chip', data.period.label)); dailyPanel.appendChild(dailyHead);
    const chartScroll = el('div', 'ops-chart-scroll'); const chart = el('div', 'ops-chart');
    const maxima = { prospections: 1, visits: 1, sales: 1 };
    data.daily.forEach((day) => { maxima.prospections = Math.max(maxima.prospections, day.prospections); maxima.visits = Math.max(maxima.visits, day.visits); maxima.sales = Math.max(maxima.sales, day.sales); });
    data.daily.forEach((day) => {

  function shiftOperationDate(value, offset) {
    const [year, month, day] = String(value).split('-').map(Number);

  }
  function mondayOfOperationWeek(value) {

  }

  function normalizeCsvHeader(value) {
    return String(value || '').replace(/^\uFEFF/, '').trim().toLocaleLowerCase('pt-BR').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]/g, '');
  }

  function parseCsv(text) {
    const source = String(text || '').replace(/^\uFEFF/, '');
    const firstLine = (source.split(/\r?\n/, 1)[0] || '');
    let commas = 0; let semicolons = 0; let quoted = false;
    for (let i = 0; i < firstLine.length; i += 1) {
      if (firstLine[i] === '"' && firstLine[i + 1] === '"' && quoted) { i += 1; continue; }
      if (firstLine[i] === '"') quoted = !quoted;
      else if (!quoted && firstLine[i] === ',') commas += 1;
      else if (!quoted && firstLine[i] === ';') semicolons += 1;
    }
    const delimiter = semicolons >= commas ? ';' : ',';
    const records = []; let record = []; let field = ''; quoted = false;
    for (let i = 0; i < source.length; i += 1) {
      const char = source[i];
      if (char === '"') {
        if (quoted && source[i + 1] === '"') { field += '"'; i += 1; }
        else quoted = !quoted;
      } else if (char === delimiter && !quoted) { record.push(field); field = ''; }
      else if ((char === '\n' || char === '\r') && !quoted) {
        if (char === '\r' && source[i + 1] === '\n') i += 1;
        record.push(field); field = '';
        if (record.some((value) => String(value).trim() !== '')) records.push(record);
        record = [];
      } else field += char;
    }
    record.push(field);
    if (record.some((value) => String(value).trim() !== '')) records.push(record);
    if (records.length < 2) throw new Error('A planilha precisa ter cabeçalho e pelo menos um cliente.');
    const headers = records.shift().map(normalizeCsvHeader);
    const indexes = {
      name: headers.findIndex((value) => ['nome', 'nomecompleto', 'cliente'].includes(value)),
      phone: headers.findIndex((value) => ['telefone', 'celular', 'fone'].includes(value)),
      development: headers.findIndex((value) => ['empreendimento', 'empreendimentodeinteresse'].includes(value)),
      brokerEmail: headers.findIndex((value) => ['emailcorretor', 'corretoremail', 'emailresponsavel'].includes(value)),
      notes: headers.findIndex((value) => ['observacoes', 'observacao', 'notas'].includes(value)),
      status: headers.findIndex((value) => ['status', 'statusdoatendimento'].includes(value)),
      sdrFeedback: headers.findIndex((value) => ['feedbacksdr', 'feedback'].includes(value))
    };
    const missing = ['name', 'phone', 'development', 'brokerEmail'].filter((key) => indexes[key] < 0);
    if (missing.length) throw new Error('Cabeçalhos obrigatórios ausentes: nome, telefone, empreendimento e email_corretor. Baixe o modelo e tente novamente.');
    return records.map((values) => ({
      name: values[indexes.name] || '', phone: values[indexes.phone] || '', development: values[indexes.development] || '',
      brokerEmail: values[indexes.brokerEmail] || '', notes: indexes.notes >= 0 ? values[indexes.notes] || '' : '',
      status: indexes.status >= 0 ? values[indexes.status] || '' : '', sdrFeedback: indexes.sdrFeedback >= 0 ? values[indexes.sdrFeedback] || '' : ''
    }));
  }

  function csvCell(value) {
    let text = String(value === undefined || value === null ? '' : value);
    if (/^[\s\u0000-\u001f]*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function downloadCsv(filename, headers, rows) {
    const csv = '\uFEFF' + [headers, ...rows].map((row) => row.map(csvCell).join(';')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a'); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  async function generateContract(contract, kind) {
    const tab=window.open('about:blank','_blank');
    try{const result=await callApi('apiGenerateContract',state.token,contract.id,kind||'agreement');if(!result||result.ok!==true)throw new Error(result&&result.message?result.message:'Não foi possível gerar o documento.');if(tab)tab.location=result.downloadUrl;else window.location.href=result.downloadUrl;toast(result.message,'success');await renderContracts();}
    catch(error){if(tab)tab.close();handleFailure(error);}

  async function chooseSignedContractFile(contract, kind) {
    const input=document.createElement('input');input.type='file';input.accept='.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    input.addEventListener('change',async()=>{const file=input.files&&input.files[0];if(!file)return;const documentLabel=kind==='debt_confession'?'confissão de dívida':'contrato/termo';if(!window.confirm('Antes de anexar, confirme que o '+documentLabel+' foi assinado pelo corretor, pelo SDR e pelo gerente. O CRM não valida assinaturas digitais.'))return;try{
      const prepared=await callApi('apiCreateContractUpload',state.token,contract.id,{documentKind:kind||'agreement',name:file.name,mimeType:file.type,sizeBytes:file.size});if(!prepared||prepared.ok!==true)throw new Error(prepared&&prepared.message?prepared.message:'Não foi possível preparar o envio.');
      const upload=await fetch(prepared.uploadUrl,{method:'PUT',headers:{apikey:prepared.publishableKey,'Content-Type':file.type,'x-upsert':'false'},body:file});
      if(!upload.ok)throw new Error('O arquivo não foi enviado. Tente novamente.');
      const confirmed=await callApi('apiConfirmContractSigned',state.token,contract.id,prepared.documentId,true);if(!confirmed||confirmed.ok!==true)throw new Error(confirmed&&confirmed.message?confirmed.message:'Não foi possível confirmar a assinatura.');
      toast(confirmed.message,'success');await renderContracts();
    }catch(error){handleFailure(error);}});input.click();
  }

    try{const result=await callApi('apiConfirmContractSigned',state.token,contract.id,documentInfo.id,true);if(!result||result.ok!==true)throw new Error(result&&result.message?result.message:'Não foi possível confirmar as assinaturas.');toast(result.message,'success');await renderContracts();}catch(error){handleFailure(error);}
  }

  async function renderAudit() {
    if(!isAdmin()){state.page='dashboard';setActiveNav('dashboard');return renderDashboard();}
    const [activeUsers, archivedUsers] = await Promise.all([callApi('apiListUsers',state.token),callApi('apiListArchivedUsers',state.token)]);
    const allUsers=[...activeUsers,...archivedUsers].sort((a,b)=>a.name.localeCompare(b.name,'pt-BR'));
    const area=byId('content-area');area.replaceChildren();const heading=el('div','page-heading');const title=el('div');title.append(el('h2','','Histórico administrativo'),el('p','','Rastreia autor, data e hora, módulo, ação, campos e valores anteriores e novos. Os eventos começam a ser registrados após a implantação de cada módulo.'));
    const filters=el('div','row-actions');const from=document.createElement('input');from.type='date';from.max=todayBrazil();from.setAttribute('aria-label','A partir de');const to=document.createElement('input');to.type='date';to.max=todayBrazil();to.setAttribute('aria-label','Até');
    const moduleFilter=makeSelect([{label:'CRM + operação',value:''},{label:'Relacionamento, vendas e contratos',value:'crm'},{label:'Produção, metas e frequência',value:'operations'}],'');moduleFilter.setAttribute('aria-label','Módulo');
    const entityOptions=[['','Todas as categorias'],['lead','Cliente'],['user','Usuário'],['development','Empreendimento'],['sale','Venda / repasse'],['contract','Contrato'],['broker_profile','Cadastro do corretor'],['setting','Configuração'],['operation_production','Lançamento de produção'],['operation_goal','Meta'],['operation_attendance','Frequência']];
    const entity=makeSelect(entityOptions.map(([value,label])=>({label,value})), '');entity.setAttribute('aria-label','Tipo de registro');
    const actor=makeSelect([{label:'Todos os autores',value:''},...allUsers.map((user)=>({label:user.name+' · '+user.role,value:user.id}))],'');actor.setAttribute('aria-label','Autor da alteração');
    const apply=button('Filtrar','button-small button-primary',()=>{state.pageNumber=1;load();});filters.append(from,to,moduleFilter,entity,actor,apply);heading.append(title,filters);area.appendChild(heading);
    const list=el('section','audit-list');list.appendChild(el('div','loading','Carregando histórico…'));area.appendChild(list);const footer=el('div','table-toolbar');area.appendChild(footer);
    async function load(){list.replaceChildren(el('div','loading','Carregando histórico…'));try{const result=await callApi('apiListAudit',state.token,{dateFrom:from.value,dateTo:to.value,entityType:entity.value,module:moduleFilter.value,actorId:actor.value},state.pageNumber,100);list.replaceChildren();footer.replaceChildren();if(!result||result.ok===false)throw new Error(result&&result.message?result.message:'Não foi possível carregar o histórico.');if(!result.items.length){list.appendChild(el('div','empty-state','Nenhuma alteração encontrada neste recorte.'));footer.appendChild(el('p','muted','0 alterações'));return;}result.items.forEach((item)=>{const details=document.createElement('details');details.className='audit-entry';const summary=document.createElement('summary');summary.append(el('strong','',item.actorName+' · '+item.actorRole),el('span','',(item.module==='operations'?'Produção & frequência':'CRM')+' · '+formatDate(item.at)+' · '+item.action+' · '+(entityOptions.find(([key])=>key===item.entityType)||[item.entityType,item.entityType])[1]));details.appendChild(summary);const body=el('div','audit-values');body.append(el('div','', 'Autor: '+(item.actorEmail||'—')),el('div','', 'Registro: '+item.entityId),el('div','','Campos alterados: '+(item.changedFields||'—')));const values=el('div','audit-value-grid');const before=el('div','audit-value-box');before.append(el('strong','','Antes'),el('pre','',JSON.stringify(item.beforeValues,null,2)));const after=el('div','audit-value-box');after.append(el('strong','','Depois'),el('pre','',JSON.stringify(item.afterValues,null,2)));values.append(before,after);body.appendChild(values);details.appendChild(body);list.appendChild(details);});const first=(result.page-1)*result.pageSize+1;const last=Math.min(result.total,result.page*result.pageSize);footer.appendChild(el('p','muted','Exibindo '+first+'–'+last+' de '+result.total+' alterações'));const controls=el('div','row-actions');const previous=button('Anterior','button-small',()=>{if(state.pageNumber>1){state.pageNumber-=1;load();}});const next=button('Próxima','button-small',()=>{if(state.pageNumber*result.pageSize<result.total){state.pageNumber+=1;load();}});previous.disabled=result.page<=1;next.disabled=result.page*result.pageSize>=result.total;controls.append(previous,next);footer.appendChild(controls);}catch(error){list.replaceChildren(el('div','empty-state','Não foi possível carregar o histórico.'));footer.replaceChildren();handleFailure(error);}}
    await load();
  }

  async function logout(notify) {
    await stopRealtimeSync();
    const token = state.token;
    if (token) {
      try { await callApi('apiLogout', token, state.refreshToken); } catch (_) { /* sessão já pode ter expirado */ }
    }
    if (state.pollId) window.clearInterval(state.pollId);
    state.token='';state.refreshToken='';state.user=null;state.refs=null;sessionStorage.removeItem('crm-session-token');sessionStorage.removeItem('crm-refresh-token');
    byId('app-view').classList.add('hidden');byId('login-view').classList.remove('hidden');
    if(notify)byId('login-error').textContent='Você saiu do sistema.';
  }

  async function initializeBootstrap() {
    try {
      const info = await callApi('apiBootstrapInfo');
      if (info && info.setupAvailable) {
        byId('login-card').classList.add('hidden');
        byId('bootstrap-card').classList.remove('hidden');
        byId('bootstrap-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const submit = byId('bootstrap-submit'); const error = byId('bootstrap-error');
          error.textContent = ''; submit.disabled = true; submit.textContent = 'Configurando…';
          try {
            const result = await callApi('apiBootstrapAdmin', byId('bootstrap-secret').value, byId('bootstrap-name').value, byId('bootstrap-email').value, byId('bootstrap-password').value);
            if (!result || result.ok !== true) throw new Error(result && result.message ? result.message : 'Não foi possível ativar o CRM.');
            state.token = result.token; state.refreshToken = result.refreshToken || ''; state.user = result.user;
            sessionStorage.setItem('crm-session-token', state.token);
            if (state.refreshToken) sessionStorage.setItem('crm-refresh-token', state.refreshToken);
            byId('bootstrap-password').value = ''; byId('bootstrap-secret').value = '';
            await enterApplication();
          } catch (err) { error.textContent = err.message || 'Não foi possível ativar o CRM.'; }
          finally { submit.disabled = false; submit.textContent = 'Ativar CRM'; }
        });
      }
    } catch (_) { /* a tela de login permanece disponível; a conexão será indicada ao tentar entrar */ }
  }

  byId('login-form').addEventListener('submit', login);
  initializeBootstrap().then(restoreSession);
})();
