<script>
(() => {
  'use strict';
  const state = { token: '', refreshToken: '', user: null, refs: null, page: 'dashboard', pageNumber: 1, lastDashboard: null, pollId: null, queryTimer: null };
  const byId = (id) => document.getElementById(id);
  const ADMIN_ROLES = ['Administrador', 'Gerente', 'Coordenador', 'Assistente'];
  const ROLE_LIST = ['Administrador', 'Gerente', 'Coordenador', 'Assistente', 'SDR', 'Corretor'];

  function el(tag, className, text) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (text !== undefined && text !== null) node.textContent = String(text);
    return node;
  }

  function button(text, className, onClick) {
    const node = el('button', 'button ' + (className || ''), text);
    node.type = 'button';
    node.addEventListener('click', onClick);
    return node;
  }

  function callApi(method, ...args) {
    const request = (apiMethod, apiArgs) => fetch('/.netlify/functions/crm', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
      cache: 'no-store',
      credentials: 'same-origin',
      body: JSON.stringify({ method: apiMethod, args: apiArgs })
    }).then(async (response) => ({ response, result: await response.json().catch(() => ({})) }));
    return request(method, args).then(async ({ response, result }) => {
      const refreshable = ['apiLogin', 'apiRefresh', 'apiBootstrapInfo', 'apiBootstrapAdmin', 'apiLogout'];
      if (response.status === 401 && state.refreshToken && !refreshable.includes(method)) {
        const refreshed = await request('apiRefresh', [state.refreshToken]);
        if (refreshed.response.ok && refreshed.result && refreshed.result.ok === true) {
          state.token = refreshed.result.token;
          state.refreshToken = refreshed.result.refreshToken;
          sessionStorage.setItem('crm-session-token', state.token);
          sessionStorage.setItem('crm-refresh-token', state.refreshToken);
          const retryArgs = args.slice();
          retryArgs[0] = state.token;
          const retry = await request(method, retryArgs);
          if (!retry.response.ok) throw new Error(retry.result.message || 'Falha ao comunicar com o sistema.');
          return retry.result;
        }
        state.token = ''; state.refreshToken = '';
        sessionStorage.removeItem('crm-session-token'); sessionStorage.removeItem('crm-refresh-token');
      }
      if (!response.ok) throw new Error(result.message || 'Falha ao comunicar com o sistema.');
      return result;
    });
  }

  function toast(message, kind) {
    const region = byId('toast-region');
    const item = el('div', 'toast ' + (kind || ''), message);
    region.appendChild(item);
    window.setTimeout(() => item.remove(), 4200);
  }

  function showLoading(message) {
    const area = byId('content-area');
    area.replaceChildren();
    const box = el('div', 'loading');
    const stack = el('div');
    stack.append(el('div', 'spinner'), el('div', '', message || 'Carregando dados…'));
    box.appendChild(stack);
    area.appendChild(box);
  }

  function isAdmin() { return Boolean(state.user && ADMIN_ROLES.includes(state.user.role)); }
  function isManagerOrSdr() { return Boolean(state.user && (isAdmin() || state.user.role === 'SDR')); }
  function escapeDisplay(value) { return String(value === undefined || value === null || value === '' ? '—' : value); }

  async function handleFailure(error) {
    const message = error && error.message ? error.message : 'Não foi possível concluir a operação.';
    if (/sessão (expirada|inválida)|entre novamente|sistema não inicializado/i.test(message)) {
      await logout(false);
      byId('login-error').textContent = 'Sua sessão expirou. Entre novamente.';
      return;
    }
    toast(message, 'error');
  }

  function readFilters(staleOnly) {
    const filters = {
      query: byId('filter-query').value.trim(),
      developmentId: byId('filter-development').value,
      status: byId('filter-status').value,
      dateFrom: byId('filter-from').value,
      dateTo: byId('filter-to').value,
      periodMode: byId('filter-period').value,
      staleOnly: staleOnly === true
    };
    if (isManagerOrSdr()) filters.brokerId = byId('filter-broker').value;
    return filters;
  }

  async function login(event) {
    event.preventDefault();
    const submit = byId('login-submit');
    const error = byId('login-error');
    error.textContent = '';
    submit.disabled = true;
    submit.textContent = 'Verificando…';
    try {
      const result = await callApi('apiLogin', byId('login-email').value, byId('login-password').value);
      if (!result || result.ok !== true) throw new Error(result && result.message ? result.message : 'E-mail ou senha inválidos.');
      state.token = result.token;
      state.refreshToken = result.refreshToken || '';
      state.user = result.user;
      sessionStorage.setItem('crm-session-token', state.token);
      if (state.refreshToken) sessionStorage.setItem('crm-refresh-token', state.refreshToken);
      byId('login-password').value = '';
      await enterApplication();
    } catch (err) {
      error.textContent = err.message || 'Não foi possível entrar.';
    } finally {
      submit.disabled = false;
      submit.textContent = 'Entrar no sistema';
    }
  }

  async function restoreSession() {
    const token = sessionStorage.getItem('crm-session-token');
    if (!token) return;
    state.token = token;
    state.refreshToken = sessionStorage.getItem('crm-refresh-token') || '';
    try {
      state.refs = await callApi('apiGetReferenceData', token);
      state.user = state.refs.user;
      await enterApplication(true);
    } catch (error) {
      sessionStorage.removeItem('crm-session-token');
      state.token = '';
    }
  }

  async function enterApplication(restored) {
    state.refs = await callApi('apiGetReferenceData', state.token);
    state.user = state.refs.user || state.user;
    byId('login-view').classList.add('hidden');
    byId('app-view').classList.remove('hidden');
    byId('user-name').textContent = state.user.name;
    byId('user-role').textContent = state.user.role;
    byId('user-avatar').textContent = state.user.name.split(/\s+/).slice(0, 2).map((part) => part[0]).join('').toUpperCase();
    byId('users-nav').classList.toggle('hidden', !isAdmin());
    byId('developments-nav').classList.toggle('hidden', !isAdmin());
    byId('sales-nav').classList.toggle('hidden', !isAdmin());
    byId('audit-nav').classList.toggle('hidden', !isAdmin());
    byId('contracts-nav').classList.toggle('hidden', !(isAdmin() || ['Corretor','SDR'].includes(state.user.role)));
    byId('new-leads-nav').classList.toggle('hidden', !(isAdmin() || state.user.role === 'SDR'));
    byId('sdr-alerts-nav').classList.toggle('hidden', state.user.role !== 'SDR');
    byId('broker-filter-wrap').classList.toggle('hidden', !isManagerOrSdr());
    fillFilters();
    bindNavigation();
    state.page = 'dashboard';
    setActiveNav('dashboard');
    if (state.user.mustChangePassword) showLoading('Defina uma nova senha para continuar.');
    else await refreshPage();
    if (state.pollId) window.clearInterval(state.pollId);
    state.pollId = state.user.mustChangePassword ? null : window.setInterval(() => {
      if (!document.hidden && state.token) {
        refreshPage(true).catch(handleFailure);
        if (state.user && state.user.role === 'SDR' && !['dashboard','sdrAlerts'].includes(state.page)) updateSdrNavigation().catch(handleFailure);
      }
    }, 20000);
    if (state.user.mustChangePassword) openPasswordDialog(true);
    else if (!restored) toast('Bem-vindo, ' + state.user.name.split(' ')[0] + '.', 'success');
  }

  function fillFilters() {
    const project = byId('filter-development');
    project.replaceChildren(new Option('Todos', ''));
    state.refs.developments.forEach((item) => project.add(new Option(item.name, item.id)));
    const status = byId('filter-status');
    status.replaceChildren(new Option('Todos', ''));
    state.refs.statuses.forEach((item) => status.add(new Option(item.name, item.name)));
    if (isManagerOrSdr()) {
      const broker = byId('filter-broker');
      broker.replaceChildren(new Option('Todos', ''));
      state.refs.brokers.forEach((item) => broker.add(new Option(item.name, item.id)));
    }
    document.querySelectorAll('#filters-panel input,#filters-panel select').forEach((control) => {
      control.onchange = () => { state.pageNumber = 1; refreshPage().catch(handleFailure); };
    });
    byId('filter-query').oninput = () => {
      window.clearTimeout(state.queryTimer);
      state.queryTimer = window.setTimeout(() => { state.pageNumber = 1; refreshPage().catch(handleFailure); }, 350);
    };
    byId('clear-filters').onclick = () => {
      byId('filter-query').value = '';
      byId('filter-broker').value = '';
      byId('filter-development').value = '';
      byId('filter-status').value = '';
      byId('filter-from').value = '';
      byId('filter-to').value = '';
      state.pageNumber = 1;
      refreshPage().catch(handleFailure);
    };
    byId('refresh-button').onclick = () => refreshPage().catch(handleFailure);
    byId('logout-button').onclick = () => logout(true);
    byId('change-password-button').onclick = () => openPasswordDialog(false);
  }

  function bindNavigation() {
    byId('main-nav').querySelectorAll('[data-page]').forEach((item) => {
      item.onclick = () => {
        if (item.classList.contains('hidden')) return;
        state.page = item.dataset.page;
        state.pageNumber = 1;
        setActiveNav(state.page);
        refreshPage().catch(handleFailure);
      };
    });
  }

  function setActiveNav(page) {
    byId('main-nav').querySelectorAll('[data-page]').forEach((item) => item.classList.toggle('active', item.dataset.page === page));
    const titles = { dashboard: ['PAINEL COMERCIAL', 'Visão geral'], leads: ['CARTEIRA COMERCIAL', 'Clientes'], newLeads: ['TRIAGEM COMERCIAL', 'Novos cadastros'], sdrAlerts: ['ACOMPANHAMENTO SDR', 'Alertas SDR'], archivedLeads: ['ADMINISTRAÇÃO', 'Clientes excluídos'], followups: ['ACOMPANHAMENTO', 'Follow-ups'], users: ['ADMINISTRAÇÃO', 'Equipe'], archivedUsers: ['ADMINISTRAÇÃO', 'Usuários excluídos'], developments: ['CONFIGURAÇÃO COMERCIAL', 'Empreendimentos'], sales: ['CONTROLE FINANCEIRO', 'Vendas e repasses'], contracts: ['DOCUMENTOS COMERCIAIS', 'Contratos'], audit: ['ADMINISTRAÇÃO', 'Histórico de alterações'] };
    const current = titles[page] || titles.dashboard;
    const navPage = page === 'archivedLeads' ? 'leads' : page === 'archivedUsers' ? 'users' : page;
    byId('page-kicker').textContent = current[0];
    byId('page-title').textContent = current[1];
    byId('main-nav').querySelectorAll('[data-page]').forEach((item) => item.classList.toggle('active', item.dataset.page === navPage));
    const filters = byId('filters-panel');
    filters.classList.toggle('hidden', ['users','archivedUsers','developments','sales','contracts','audit'].includes(page));
    filters.classList.toggle('dashboard-mode', page === 'dashboard');
    if (page === 'dashboard') { byId('filter-query').value = ''; byId('filter-status').value = ''; }
  }

  async function refreshPage(silent) {
    if (!state.token) return;
    if (!silent) showLoading('Atualizando ' + (state.page === 'dashboard' ? 'indicadores' : 'dados') + '…');
    if (state.page === 'dashboard') await renderDashboard();
    else if (state.page === 'leads') await renderLeads(false);
    else if (state.page === 'newLeads') await renderLeads(false, 'new');
    else if (state.page === 'sdrAlerts') await renderSdrAlertsPage();
    else if (state.page === 'archivedLeads') await renderArchivedLeads();
    else if (state.page === 'followups') await renderLeads(true);
    else if (state.page === 'users') await renderUsers();
    else if (state.page === 'archivedUsers') await renderArchivedUsers();
    else if (state.page === 'developments') await renderDevelopments();
    else if (state.page === 'sales') await renderSales();
    else if (state.page === 'contracts') await renderContracts();
    else if (state.page === 'audit') await renderAudit();
  }

  function kpi(label, value, sub, color) {
    const card = el('article', 'kpi-card');
    const accent = el('span', 'kpi-accent');
    if (color) accent.style.backgroundColor = color;
    card.append(accent, el('div', 'kpi-label', label), el('div', 'kpi-value', value), el('div', 'kpi-sub', sub || ''));
    return card;
  }

  async function renderDashboard() {
    const data = await callApi('apiGetDashboard', state.token, readFilters(false));
    const sdrWorklist = state.user.role === 'SDR' ? await callApi('apiGetSdrWorklist', state.token) : null;
    state.lastDashboard = data;
    byId('stale-badge').textContent = data.staleCount > 99 ? '99+' : String(data.staleCount || '');
    byId('stale-badge').classList.toggle('hidden', !data.staleCount);
    const area = byId('content-area');
    area.replaceChildren();
    const heading = el('div', 'page-heading');
    const text = el('div');
    text.append(el('h2', '', 'Acompanhamento da operação'), el('p', '', 'Indicadores atuais e históricos por carteira, empreendimento e período. Sincronização automática a cada 20 segundos.'));
    heading.append(text);
    if (isAdmin()) heading.appendChild(button('Exportar relatório CSV', 'button-small', exportReport));
    area.appendChild(heading);

    const cards = el('section', 'kpi-grid');
    cards.append(
      kpi('Total de clientes', data.total, 'Na seleção atual', '#EE7A00'),
      kpi('Em atendimento', data.activeAttendance, 'Status atual', '#3b82f6'),
      kpi('Agendamentos', data.appointments, 'Atendimentos marcados', '#8b5cf6'),
      kpi('Atendimentos realizados', data.completed, 'Etapa concluída', '#14b8a6'),
      kpi('Aprovados pela Caixa', data.approved, 'Aprovações', '#22c55e'),
      kpi('Reprovados pela Caixa', data.rejected, 'Reprovações', '#ef4444'),
      kpi('Desistências', data.withdrawals, 'Clientes encerrados', '#9ca3af'),
      kpi('Já compraram', data.purchased, 'Conversões registradas', '#16a34a')
    );
    area.appendChild(cards);

    const grid = el('div', 'dashboard-grid');
    const funnel = el('section', 'panel');
    const funnelHeader = el('div', 'panel-header');
    const funnelTitle = el('div');
    funnelTitle.append(el('h3', '', 'Funil de atendimento'), el('p', '', 'Distribuição de clientes por etapa'));
    funnelHeader.append(funnelTitle, el('span', 'panel-chip', '10 etapas'));
    funnel.appendChild(funnelHeader);
    const list = el('div', 'funnel-list');
    const maximum = Math.max(1, ...Object.values(data.stageCounts));
    state.refs.statuses.forEach((status) => {
      const row = el('div', 'funnel-row');
      const name = el('div', 'funnel-name', status.name);
      const track = el('div', 'funnel-track');
      const fill = el('div', 'funnel-fill');
      fill.style.backgroundColor = status.color;
      fill.style.width = Math.round((data.stageCounts[status.name] / maximum) * 100) + '%';
      track.appendChild(fill);
      row.append(name, track, el('div', 'funnel-count', data.stageCounts[status.name]));
      list.appendChild(row);
    });
    funnel.appendChild(list);

    const ranking = el('section', 'panel');
    const rankingHeader = el('div', 'panel-header');
    const rankingTitle = el('div');
    rankingTitle.append(el('h3', '', 'Ranking de corretores'), el('p', '', 'Clientes cadastrados e distribuição por etapa'));
    rankingHeader.append(rankingTitle, el('span', 'panel-chip', data.ranking.length + ' corretores'));
    ranking.appendChild(rankingHeader);
    if (!data.ranking.length) ranking.appendChild(el('div', 'empty-state', 'Nenhum corretor na seleção.'));
    else {
      const table = el('table', 'ranking-table');
      const thead = el('thead'); const headerRow = el('tr');
      ['Corretor', 'Clientes', 'Distribuição do funil'].forEach((label) => headerRow.appendChild(el('th', '', label)));
      thead.appendChild(headerRow); table.appendChild(thead);
      const tbody = el('tbody');
      data.ranking.forEach((broker) => {
        const tr = el('tr');
        tr.appendChild(el('td', '', broker.name + (broker.active ? '' : ' · inativo')));
        tr.appendChild(el('td', 'ranking-number', broker.total));
        const td = el('td'); const distribution = el('div', 'distribution');
        const titleParts = [];
        state.refs.statuses.forEach((status) => {
          const count = broker.statuses[status.name] || 0;
          titleParts.push(status.name + ': ' + count);
          if (count > 0) {
            const segment = el('span');
            segment.style.backgroundColor = status.color;
            segment.style.width = (count / Math.max(1, broker.total) * 100) + '%';
            distribution.appendChild(segment);
          }
        });
        distribution.title = titleParts.join(' · ');
        td.appendChild(distribution); tr.appendChild(td); tbody.appendChild(tr);
      });
      table.appendChild(tbody); ranking.appendChild(table);
    }
    grid.append(funnel, ranking);
    area.appendChild(grid);

    const stalePanel = el('section', 'panel');
    const staleHead = el('div', 'panel-header');
    const staleTitle = el('div');
    staleTitle.append(el('h3', '', 'Atenção para follow-up'), el('p', '', 'Clientes sem atualização do SDR por ' + data.staleBusinessDays + ' dias úteis ou mais.'));
    const staleActions = el('div', 'row-actions');
    if (isAdmin()) staleActions.appendChild(button('Configurar prazo', 'button-small', () => openFollowupSettings(data.staleBusinessDays)));
    staleActions.appendChild(button('Ver lista', 'button-small', () => { state.page = 'followups'; setActiveNav('followups'); refreshPage().catch(handleFailure); }));
    staleHead.append(staleTitle, staleActions);
    stalePanel.appendChild(staleHead);
    if (!data.staleLeads.length) stalePanel.appendChild(el('div', 'empty-state', 'Tudo em dia. Não há clientes vencidos para follow-up.'));
    else stalePanel.appendChild(buildStalePreview(data.staleLeads));
    area.appendChild(stalePanel);
    if (sdrWorklist) {
      updateSdrBadges(sdrWorklist);
      area.appendChild(buildSdrAlerts(sdrWorklist));
    }
    area.appendChild(buildAnalyticsPanel(data.analytics));
  }

  function buildSdrAlerts(worklist) {
    const panel = el('section', 'panel sdr-worklist-panel');
    const head = el('div', 'panel-header'); const title = el('div');
    title.append(el('h3', '', 'Fila de ação do SDR'), el('p', '', 'Avisos internos no painel; não são enviados por e-mail ou WhatsApp. A regra de 24 horas inclui fins de semana.'));
    head.append(title, el('span', 'panel-chip', 'Acompanhamento diário')); panel.appendChild(head);
    const cards = el('div', 'sdr-alert-summary');
    cards.append(kpi('Novos cadastros', worklist.newLeads.length, 'Ainda sem primeiro contato', '#EE7A00'),
      kpi('Aguardando há 24h+', worklist.followupAlerts.length, 'Desde o último contato ou cadastro', '#f59e0b'),
      kpi('7ª tentativa sem avanço', worklist.sevenAttemptAlerts.length, 'Revisar possível desistência', '#dc2626'),
      kpi('Telefone para corrigir', worklist.phoneCorrections.length, 'Pendente para o corretor', '#7c3aed'));
    panel.appendChild(cards);
    const groups = [
      ['Aguardando contato há 24 horas ou mais', worklist.followupAlerts, 'O prazo é contínuo, inclusive aos sábados e domingos.'],
      ['Leads para revisar após a 7ª tentativa', worklist.sevenAttemptAlerts, 'O sistema não altera o status automaticamente. Abra o cadastro e decida se cabe “Desistência”.'],
      ['Telefones marcados como incorretos', worklist.phoneCorrections, 'A solicitação aparece na carteira do corretor responsável para correção.']
    ];
    groups.forEach(([label, items, hint]) => {
      const section = el('div', 'sdr-alert-group'); const groupHead = el('div', 'sdr-alert-group-head');
      groupHead.append(el('h4', '', label), el('span', 'panel-chip', String(items.length)));
      section.append(groupHead, el('p', 'muted', hint));
      if (!items.length) section.appendChild(el('div', 'sdr-history-empty', 'Nenhum registro nesta fila.'));
      else {
        const list = el('div', 'sdr-alert-list');
        items.slice(0, 6).forEach((lead) => {
          const row = el('div', 'sdr-alert-row'); const info = el('div');
          info.append(el('strong', '', lead.name), el('small', '', lead.brokerName + ' · ' + lead.developmentName));
          const action = button('Abrir', 'button-small', () => openLeadDialog(lead));
          row.append(info, action); list.appendChild(row);
        });
        section.appendChild(list);
        if (items.length > 6) section.appendChild(el('p', 'muted', 'Mais ' + (items.length - 6) + ' registro(s) nesta fila.'));
      }
      panel.appendChild(section);
    });
    const footer = el('div', 'row-actions');
    footer.append(button('Abrir novos cadastros', 'button-small button-primary', () => { state.page = 'newLeads'; state.pageNumber = 1; setActiveNav(state.page); refreshPage().catch(handleFailure); }));
    panel.appendChild(footer);
    return panel;
  }

  function updateSdrBadges(worklist) {
    const newCount = worklist.newLeads.length;
    const attentionCount = worklist.followupAlerts.length + worklist.sevenAttemptAlerts.length + worklist.phoneCorrections.length;
    const newBadge = byId('new-leads-badge'); newBadge.textContent = newCount > 99 ? '99+' : String(newCount || ''); newBadge.classList.toggle('hidden', !newCount);
    const alertBadge = byId('sdr-alert-badge'); alertBadge.textContent = attentionCount > 99 ? '99+' : String(attentionCount || ''); alertBadge.classList.toggle('hidden', !attentionCount);
  }

  async function updateSdrNavigation() {
    if (!state.user || state.user.role !== 'SDR' || !state.token) return;
    const worklist = await callApi('apiGetSdrWorklist', state.token);
    updateSdrBadges(worklist);
  }

  async function renderSdrAlertsPage() {
    if (state.user.role !== 'SDR') { state.page = 'dashboard'; setActiveNav('dashboard'); return renderDashboard(); }
    const worklist = await callApi('apiGetSdrWorklist', state.token); updateSdrBadges(worklist);
    const area = byId('content-area'); area.replaceChildren();
    area.appendChild(el('div','page-heading', 'Os alertas são exibidos apenas dentro do CRM. Nenhum e-mail ou WhatsApp é enviado.'));
    area.appendChild(buildSdrAlerts(worklist));
  }

  function buildAnalyticsPanel(analytics) {
    const panel = el('section', 'panel analytics-panel');
    const head = el('div', 'panel-header'); const title = el('div');
    title.append(el('h3', '', 'Análises históricas e alertas gerenciais'), el('p', '', analytics.comparisonLabel || ('Comparação de ' + analytics.periodLabel + ' com o período anterior.')));
    head.append(title, el('span', 'panel-chip', 'Histórico progressivo'));
    panel.appendChild(head);
    const current = analytics.current; const previous = analytics.previous;
    const summary = el('div', 'analytics-summary');
    summary.append(
      kpi('Novos cadastros', current.newLeads, 'Período anterior: ' + previous.newLeads, '#EE7A00'),
      kpi('Contatos do SDR', current.sdrContacts, 'Período anterior: ' + previous.sdrContacts, '#8b5cf6'),
      kpi('Conversão geral', current.overallConversion === null ? '—' : current.overallConversion + '%', 'Anterior: ' + (previous.overallConversion === null ? '—' : previous.overallConversion + '%') + ' · ' + current.purchased + ' compras', '#16a34a'),
      kpi('1º contato médio', current.averageFirstContactHours === null ? '—' : current.averageFirstContactHours + ' h', 'Anterior: ' + (previous.averageFirstContactHours === null ? '—' : previous.averageFirstContactHours + ' h') + ' · ' + current.firstContactCount + ' clientes', '#3b82f6'),
      kpi('Follow-ups atrasados', analytics.staleCurrent === null ? '—' : analytics.staleCurrent, 'Período anterior: ' + (analytics.stalePrevious === null ? '—' : analytics.stalePrevious), analytics.stalePrevious !== null && analytics.staleCurrent > analytics.stalePrevious ? '#ef4444' : '#14b8a6')
    );
    panel.appendChild(summary);

    const conversionBlock = el('div', 'conversion-block');
    const conversionTitle = el('div', 'analytics-section-title');
    conversionTitle.append(el('h4', '', 'Conversão entre etapas'), el('p', '', analytics.conversionBasis));
    conversionBlock.appendChild(conversionTitle);
    const scroll = el('div', 'table-scroll'); const table = el('table', 'data-table');
    const headRow = el('tr'); ['Etapa de origem', 'Próxima etapa', 'Entraram', 'Avançaram', 'Conversão', 'Período anterior'].forEach((label) => headRow.appendChild(el('th', '', label)));
    const thead = el('thead'); thead.appendChild(headRow); table.appendChild(thead);
    const tbody = el('tbody');
    current.conversions.forEach((item, index) => {

  function parseCsv(text) {

      if (firstLine[i] === '"') quoted = !quoted;
      else if (!quoted && firstLine[i] === ',') commas += 1;

    const delimiter = semicolons >= commas ? ';' : ',';
    const records = []; let record = []; let field = ''; quoted = false;
    for (let i = 0; i < source.length; i += 1) {
      const char = source[i];
      if (char === '"') {

        else quoted = !quoted;
      } else if (char === delimiter && !quoted) { record.push(field); field = ''; }
      else if ((char === '\n' || char === '\r') && !quoted) {
        if (char === '\r' && source[i + 1] === '\n') i += 1;
        record.push(field); field = '';
        if (record.some((value) => String(value).trim() !== '')) records.push(record);
        record = [];
      } else field += char;
    }
    record.push(field);
    if (record.some((value) => String(value).trim() !== '')) records.push(record);
    if (records.length < 2) throw new Error('A planilha precisa ter cabeçalho e pelo menos um cliente.');
    const headers = records.shift().map(normalizeCsvHeader);
    const indexes = {
      name: headers.findIndex((value) => ['nome', 'nomecompleto', 'cliente'].includes(value)),
      phone: headers.findIndex((value) => ['telefone', 'celular', 'fone'].includes(value)),
      development: headers.findIndex((value) => ['empreendimento', 'empreendimentodeinteresse'].includes(value)),
      brokerEmail: headers.findIndex((value) => ['emailcorretor', 'corretoremail', 'emailresponsavel'].includes(value)),
      notes: headers.findIndex((value) => ['observacoes', 'observacao', 'notas'].includes(value)),
      status: headers.findIndex((value) => ['status', 'statusdoatendimento'].includes(value)),
      sdrFeedback: headers.findIndex((value) => ['feedbacksdr', 'feedback'].includes(value))
    };
    const missing = ['name', 'phone', 'development', 'brokerEmail'].filter((key) => indexes[key] < 0);
    if (missing.length) throw new Error('Cabeçalhos obrigatórios ausentes: nome, telefone, empreendimento e email_corretor. Baixe o modelo e tente novamente.');
    return records.map((values) => ({
      name: values[indexes.name] || '', phone: values[indexes.phone] || '', development: values[indexes.development] || '',
      brokerEmail: values[indexes.brokerEmail] || '', notes: indexes.notes >= 0 ? values[indexes.notes] || '' : '',
      status: indexes.status >= 0 ? values[indexes.status] || '' : '', sdrFeedback: indexes.sdrFeedback >= 0 ? values[indexes.sdrFeedback] || '' : ''
    }));
  }

  function csvCell(value) {
    let text = String(value === undefined || value === null ? '' : value);
    if (/^[\s\u0000-\u001f]*[=+\-@]/.test(text)) text = "'" + text;
    return '"' + text.replace(/"/g, '""') + '"';
  }

  function downloadCsv(filename, headers, rows) {
    const csv = '\uFEFF' + [headers, ...rows].map((row) => row.map(csvCell).join(';')).join('\r\n');
    const url = URL.createObjectURL(new Blob([csv], { type: 'text/csv;charset=utf-8' }));
    const link = document.createElement('a'); link.href = url; link.download = filename; document.body.appendChild(link); link.click(); link.remove();
    window.setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

    addField(grid,'Unidade / torre',unit);addField(grid,'Valor da venda (R$)',unitValue);addField(grid,'Nº da proposta / pasta',proposal);addField(grid,'Base de cálculo da comissão (R$)',commissionBase);addField(grid,'Percentual de comissão (%)',commissionRate);addField(grid,'Comissão bruta total (R$)',commission);grid.appendChild(prizeLabel);addField(grid,'Percentual do prêmio (%)',prizeRate);addField(grid,'Prêmio bruto total (R$)',prize);
    const splitHint=el('p','field-hint','O total bruto da comissão e do prêmio é informado pela gestão; o CRM divide cada valor em 50% para o corretor e 50% para o SDR. Base e percentuais podem ficar em branco quando não se aplicarem ao produto. O CPF do comprador e do SDR, além do CPF, CNPJ, CRECI e endereço do corretor, serão necessários para gerar o termo.');grid.appendChild(splitHint);
    lead.addEventListener('change',()=>{const chosen=leads.find((item)=>item.id===lead.value);if(!chosen)return;buyer.value=chosen.name;development.value=chosen.developmentId;broker.value=chosen.brokerId;});
    form.appendChild(grid);const error=el('p','form-error');error.setAttribute('role','alert');form.appendChild(error);const actions=el('div','modal-actions');actions.append(button('Cancelar','',()=>dialog.close()));const save=el('button','button button-primary','Salvar rascunho');save.type='submit';actions.appendChild(save);form.appendChild(actions);box.appendChild(form);content.appendChild(box);
    form.addEventListener('submit',async(event)=>{event.preventDefault();error.textContent='';save.disabled=true;try{const result=await callApi('apiSaveContract',state.token,{id:contract?contract.id:'',leadId:lead.value,brokerId:broker.value,sdrId:sdr.value,sdrCpf:sdrCpf.value,managerId:manager.value,buyerName:buyer.value,buyerCpf:cpf.value,buyerAddress:address.value,developmentId:development.value,unit:unit.value,proposalNumber:proposal.value,unitValue:unitValue.value,commissionBase:commissionBase.value,commissionRatePct:commissionRate.value,grossCommission:commission.value,hasPrize:hasPrize.checked,prizeRatePct:prizeRate.value,grossPrize:prize.value});if(!result||result.ok!==true)throw new Error(result&&result.message?result.message:'Não foi possível salvar o contrato.');dialog.close();toast(result.message,'success');await renderContracts();}catch(err){error.textContent=err.message;}finally{save.disabled=false;}});
    dialog.showModal();
  }

  async function openContractTemplateDialog() {
    const data=await callApi('apiGetContractTemplate',state.token);const dialog=byId('admin-dialog');const content=byId('admin-dialog-content');content.replaceChildren();const box=el('div','modal-content');
    box.append(el('h2','','Modelo de contrato'),el('p','muted','O termo em branco enviado pela empresa já está carregado como modelo inicial. Revise e ajuste a estrutura conforme necessário, preservando as cláusulas aprovadas. Os marcadores abaixo são preenchidos a partir do CRM; a gestão deve validar o texto jurídico antes de gerar documentos.'));

    const form=el('form');const template=document.createElement('textarea');template.className='template-editor';template.maxLength=100000;template.required=true;template.value=data.template;addField(form,'Modelo HTML aprovado',template,true);
    const error=el('p','form-error');error.setAttribute('role','alert');form.appendChild(error);const actions=el('div','modal-actions');actions.append(button('Cancelar','',()=>dialog.close()));const save=el('button','button button-primary','Salvar modelo');save.type='submit';actions.appendChild(save);form.appendChild(actions);box.appendChild(form);content.appendChild(box);
    form.addEventListener('submit',async(event)=>{event.preventDefault();error.textContent='';save.disabled=true;try{const result=await callApi('apiSaveContractTemplate',state.token,template.value);if(!result||result.ok!==true)throw new Error(result&&result.message?result.message:'Não foi possível salvar.');dialog.close();toast(result.message,'success');}catch(err){error.textContent=err.message;}finally{save.disabled=false;}});dialog.showModal();

  async function renderBrokerProfiles() {
    const rows=await callApi('apiListBrokerProfiles',state.token);const dialog=byId('admin-dialog');const content=byId('admin-dialog-content');content.replaceChildren();const box=el('div','modal-content');box.append(el('h2','','Dados cadastrais dos corretores'),el('p','muted','Essas informações serão carregadas no documento de contrato gerado.'));
    const panel=el('section','table-panel');const table=el('table','data-table');const head=el('thead');const h=el('tr');['Corretor','CPF','CNPJ','CRECI','Endereço','Ação'].forEach((x)=>h.appendChild(el('th','',x)));head.appendChild(h);table.appendChild(head);const body=el('tbody');
    rows.forEach((item)=>{const tr=el('tr');tr.append(el('td','',item.name),el('td','',item.cpf||'—'),el('td','',item.cnpj||'—'),el('td','',item.creci||'—'),el('td','',item.address||'—'));const action=el('td');action.appendChild(button('Editar','button-small',()=>openBrokerProfileDialog(item,renderBrokerProfiles)));tr.appendChild(action);body.appendChild(tr);});table.appendChild(body);const scroll=el('div','table-scroll');scroll.appendChild(table);panel.appendChild(scroll);box.appendChild(panel);box.appendChild(button('Fechar','button-small',()=>dialog.close()));content.appendChild(box);if(!dialog.open)dialog.showModal();
  }

  function openBrokerProfileDialog(profile, onSaved) {
    const dialog=byId('user-dialog');const content=byId('user-dialog-content');content.replaceChildren();const box=el('div','modal-content');box.append(el('h2','','Cadastro do corretor'),el('p','muted',profile.name));const form=el('form');const grid=el('div','form-grid');
    const cpf=document.createElement('input');cpf.value=profile.cpf;const cnpj=document.createElement('input');cnpj.value=profile.cnpj;const creci=document.createElement('input');creci.value=profile.creci;const address=document.createElement('textarea');address.value=profile.address;address.maxLength=500;
    addField(grid,'CPF',cpf);addField(grid,'CNPJ',cnpj);addField(grid,'CRECI',creci);addField(grid,'Endereço',address,true);form.appendChild(grid);const error=el('p','form-error');error.setAttribute('role','alert');form.appendChild(error);const actions=el('div','modal-actions');actions.append(button('Cancelar','',()=>dialog.close()));const save=el('button','button button-primary','Salvar dados');save.type='submit';actions.appendChild(save);form.appendChild(actions);box.appendChild(form);content.appendChild(box);
    form.addEventListener('submit',async(event)=>{event.preventDefault();error.textContent='';save.disabled=true;try{const result=await callApi('apiSaveBrokerProfile',state.token,{brokerId:profile.brokerId,cpf:cpf.value,cnpj:cnpj.value,creci:creci.value,address:address.value});if(!result||result.ok!==true)throw new Error(result&&result.message?result.message:'Não foi possível salvar.');dialog.close();toast(result.message,'success');await onSaved();}catch(err){error.textContent=err.message;}finally{save.disabled=false;}});dialog.showModal();
  }

  async function generateContract(contract) {
    const tab=window.open('about:blank','_blank');
    try{const result=await callApi('apiGenerateContract',state.token,contract.id);if(!result||result.ok!==true)throw new Error(result&&result.message?result.message:'Não foi possível gerar o documento.');if(tab)tab.location=result.downloadUrl;else window.location.href=result.downloadUrl;toast(result.message,'success');await renderContracts();}
    catch(error){if(tab)tab.close();handleFailure(error);}
  }

  async function chooseSignedContractFile(contract) {
    const input=document.createElement('input');input.type='file';input.accept='.pdf,.doc,.docx,application/pdf,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document';
    input.addEventListener('change',async()=>{const file=input.files&&input.files[0];if(!file)return;try{
      const prepared=await callApi('apiCreateContractUpload',state.token,contract.id,{name:file.name,mimeType:file.type,sizeBytes:file.size});if(!prepared||prepared.ok!==true)throw new Error(prepared&&prepared.message?prepared.message:'Não foi possível preparar o envio.');
      const upload=await fetch(prepared.uploadUrl,{method:'PUT',headers:{apikey:prepared.publishableKey,'Content-Type':file.type,'x-upsert':'false'},body:file});
      if(!upload.ok)throw new Error('O arquivo não foi enviado. Tente novamente.');
      const confirmed=await callApi('apiConfirmContractSigned',state.token,contract.id,prepared.documentId);if(!confirmed||confirmed.ok!==true)throw new Error(confirmed&&confirmed.message?confirmed.message:'Não foi possível confirmar a assinatura.');
      toast(confirmed.message,'success');await renderContracts();
    }catch(error){handleFailure(error);}});input.click();
  }

  async function downloadContractDocument(documentInfo) {
    try{const result=await callApi('apiGetContractDocument',state.token,documentInfo.id);if(!result||!result.downloadUrl)throw new Error('Documento indisponível.');window.location.href=result.downloadUrl;}catch(error){handleFailure(error);}
  }

  async function renderAudit() {
    if(!isAdmin()){state.page='dashboard';setActiveNav('dashboard');return renderDashboard();}
    const area=byId('content-area');area.replaceChildren();const heading=el('div','page-heading');const title=el('div');title.append(el('h2','','Histórico administrativo detalhado'),el('p','','Mostra autor, data, ação, campos alterados e valores anteriores e novos a partir da implantação desta melhoria.'));
    const filters=el('div','row-actions');const from=document.createElement('input');from.type='date';from.setAttribute('aria-label','A partir de');const to=document.createElement('input');to.type='date';to.setAttribute('aria-label','Até');const entity=makeSelect([{label:'Todos os registros',value:''},...['lead','user','development','sale','contract','broker_profile','setting'].map((value)=>({label:value,value}))],'');
    const apply=button('Filtrar','button-small button-primary',()=>{state.pageNumber=1;load();});filters.append(from,to,entity,apply);heading.append(title,filters);area.appendChild(heading);
    const list=el('section','audit-list');list.appendChild(el('div','loading','Carregando histórico…'));area.appendChild(list);
    const footer=el('div','table-toolbar');area.appendChild(footer);
    async function load(){list.replaceChildren(el('div','loading','Carregando histórico…'));try{const result=await callApi('apiListAudit',state.token,{dateFrom:from.value,dateTo:to.value,entityType:entity.value},state.pageNumber,100);list.replaceChildren();footer.replaceChildren();if(!result||result.ok===false)throw new Error(result&&result.message?result.message:'Não foi possível carregar o histórico.');if(!result.items.length){list.appendChild(el('div','empty-state','Nenhuma alteração encontrada neste recorte.'));footer.appendChild(el('p','muted','0 alterações'));return;}result.items.forEach((item)=>{const details=document.createElement('details');details.className='audit-entry';const summary=document.createElement('summary');summary.append(el('strong','',item.actorName+' · '+item.actorRole),el('span','',formatDate(item.at)+' · '+item.action+' · '+item.entityType));details.appendChild(summary);const body=el('div','audit-values');body.append(el('div','', 'Registro: '+item.entityId),el('div','','Campos: '+(item.changedFields||'—')));const values=el('div','audit-value-grid');const before=el('div','audit-value-box');before.append(el('strong','','Antes'),el('pre','',JSON.stringify(item.beforeValues,null,2)));const after=el('div','audit-value-box');after.append(el('strong','','Depois'),el('pre','',JSON.stringify(item.afterValues,null,2)));values.append(before,after);body.appendChild(values);details.appendChild(body);list.appendChild(details);});const first=(result.page-1)*result.pageSize+1;const last=Math.min(result.total,result.page*result.pageSize);footer.appendChild(el('p','muted','Exibindo '+first+'–'+last+' de '+result.total+' alterações'));const controls=el('div','row-actions');const previous=button('Anterior','button-small',()=>{if(state.pageNumber>1){state.pageNumber-=1;load();}});const next=button('Próxima','button-small',()=>{if(state.pageNumber*result.pageSize<result.total){state.pageNumber+=1;load();}});previous.disabled=result.page<=1;next.disabled=result.page*result.pageSize>=result.total;controls.append(previous,next);footer.appendChild(controls);}catch(error){list.replaceChildren(el('div','empty-state','Não foi possível carregar o histórico.'));footer.replaceChildren();handleFailure(error);}}
    await load();
  }

  async function logout(notify) {
    const token = state.token;
    if (token) {
      try { await callApi('apiLogout', token, state.refreshToken); } catch (_) { /* sessão já pode ter expirado */ }
    }
    if (state.pollId) window.clearInterval(state.pollId);
    state.token='';state.refreshToken='';state.user=null;state.refs=null;sessionStorage.removeItem('crm-session-token');sessionStorage.removeItem('crm-refresh-token');
    byId('app-view').classList.add('hidden');byId('login-view').classList.remove('hidden');
    if(notify)byId('login-error').textContent='Você saiu do sistema.';
  }

  async function initializeBootstrap() {
    try {
      const info = await callApi('apiBootstrapInfo');
      if (info && info.setupAvailable) {
        byId('login-card').classList.add('hidden');
        byId('bootstrap-card').classList.remove('hidden');
        byId('bootstrap-form').addEventListener('submit', async (event) => {
          event.preventDefault();
          const submit = byId('bootstrap-submit'); const error = byId('bootstrap-error');
          error.textContent = ''; submit.disabled = true; submit.textContent = 'Configurando…';
          try {
            const result = await callApi('apiBootstrapAdmin', byId('bootstrap-secret').value, byId('bootstrap-name').value, byId('bootstrap-email').value, byId('bootstrap-password').value);
            if (!result || result.ok !== true) throw new Error(result && result.message ? result.message : 'Não foi possível ativar o CRM.');
            state.token = result.token; state.refreshToken = result.refreshToken || ''; state.user = result.user;
            sessionStorage.setItem('crm-session-token', state.token);
            if (state.refreshToken) sessionStorage.setItem('crm-refresh-token', state.refreshToken);
            byId('bootstrap-password').value = ''; byId('bootstrap-secret').value = '';
            await enterApplication();
          } catch (err) { error.textContent = err.message || 'Não foi possível ativar o CRM.'; }
          finally { submit.disabled = false; submit.textContent = 'Ativar CRM'; }
        });
      }
    } catch (_) { /* a tela de login permanece disponível; a conexão será indicada ao tentar entrar */ }
  }

  byId('login-form').addEventListener('submit', login);
  initializeBootstrap().then(restoreSession);
})();
</script>
